name: mindsurf

services:
  backend:
    image: ${MINDSURF_IMAGE:?MINDSURF_IMAGE must name an immutable GHCR image}
    container_name: mindsurf-backend
    restart: unless-stopped
    init: true
    gpus: all
    shm_size: "2gb"
    ports:
      - "127.0.0.1:${MINDSURF_PORT:-8000}:8000"
    env_file:
      - ${MINDSURF_ENV_FILE:-/etc/mindsurf/backend.env}
    environment:
      HF_HOME: /cache/huggingface
      XDG_CACHE_HOME: /cache
    volumes:
      - ${MINDSURF_RELEASE_DIR:-/srv/mindsurf/release}:/models/release:ro
      - ${MINIMIND_O_DIR:-/srv/mindsurf/minimind-o}:/models/minimind-o:ro
      - ${MINDSURF_CACHE_DIR:-/srv/mindsurf/cache}:/cache
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
